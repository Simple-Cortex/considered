[workspace]
resolver = "2"
members = [
    "crates/considered-core",
    "crates/considered-scan",
    "crates/considered-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/Simple-Cortex/considered"

[workspace.dependencies]
considered-core = { path = "crates/considered-core" }
considered-scan = { path = "crates/considered-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
regex = "1"
